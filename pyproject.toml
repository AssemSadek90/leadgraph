[project]
name = "leadgraph"
version = "0.1.0"
description = "Agentic lead research pipeline: discover, classify, enrich and score companies with evidence."
readme = "README.md"
authors = [{ name = "Asem Mohamed" }]
requires-python = ">=3.12"
dependencies = [
    "diskcache>=5.6.3",
    "dnspython>=2.9.2",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-anthropic>=1.7.10",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "selectolax>=1.0.2",
    "tenacity>=9.2.1",
    "trafilatura>=2.3.1",
    "typer>=0.28.0",
]

[project.scripts]
leadgraph = "leadgraph.cli:main"

[project.optional-dependencies]
eval = [
    "langfuse>=5.2.0",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits the network or paid APIs (deselect with -m 'not live')"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP046", "UP047"]  # keep TypeVar generics (data contract style)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
